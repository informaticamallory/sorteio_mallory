# Configuracao do Alembic (migracoes do banco).
#
# Prefira `python -m app.migracoes`, que faz backup antes de migrar e adota
# bancos criados antes da existencia das migracoes. O comando `alembic` direto
# continua disponivel para gerar novas revisoes:
#   alembic revision --autogenerate -m "descricao"

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
# A URL do banco vem de app.config.settings (DATABASE_URL no .env).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
